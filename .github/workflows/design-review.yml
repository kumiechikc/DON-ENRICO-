name: Design Review

# Dois verificadores rodam aqui contra o mesmo servidor:
#
#   npm run check        — a suíte do projeto: responsividade, fluxo do pedido de
#                          ponta a ponta, contraste medido no DOM e acessibilidade
#   scripts/design-audit — o auditor heurístico genérico do stack de design
#
# A revisão de gosto e interação continua sendo o subagente /design-review dentro do
# Claude Code; isto aqui pega o defeito mecânico em todo PR.

on:
  pull_request:
    paths:
      # Interface
      - '**/*.html'
      - '**/*.css'
      - '**/*.jsx'
      - '**/*.tsx'
      - '**/*.vue'
      - '**/*.svelte'
      - '**/*.astro'
      # Lógica do pedido e dados do cardápio: uma regressão aqui quebra o fluxo
      # sem tocar em nenhum componente.
      - 'src/lib/**'
      # Os próprios verificadores e o que muda o build.
      - 'scripts/**'
      # O cérebro: fato sem fonte e decisão sem data apodrecem em silêncio, e
      # um cérebro frouxo é pior que nenhum porque mente com cara de autoridade.
      - 'cerebro/**'
      # O retrato da marca e a costura dele: se um muda e a outra não, o arquivo
      # que alguém levou embora passa a discordar da fonte sem ninguém ver.
      - 'CONTEXTO.md'
      - 'CONTEXTO-COMPLETO.md'
      - 'CLAUDE.md'
      - 'package.json'
      - 'next.config.ts'
      - '.github/workflows/design-review.yml'

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependências e o Chromium
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: Lint
        run: npm run lint

      - name: Cardápio e planilha em sincronia
        run: |
          npm run catalogo
          # O Catalogo.gs é gerado do menu.ts. Se o commit mexeu no cardápio sem
          # regerar, a planilha continuaria com o preço velho e o pedido do site
          # cairia lá com valor de outro mês. Falhar aqui é barato; descobrir
          # pela planilha, não.
          git diff --exit-code apps-script/Catalogo.gs
          npm run contexto
          # Mesma disciplina do Catalogo.gs: o CONTEXTO-COMPLETO.md é costurado
          # de seis arquivos e existe para ser levado embora. Se alguém editar a
          # cópia em vez da fonte, ou mexer na fonte sem regerar, o arquivo que
          # foi parar noutro repositório passa a mentir — e ele tem cara de
          # autoridade justamente por ser completo.
          git diff --exit-code CONTEXTO-COMPLETO.md
          npm run check:planilha
          npm run check:pix
          npm run check:midia
          npm run check:cerebro

      # O export estático do GitHub Pages tem restrições que o build comum não
      # expõe (rotas de imagem precisam ser force-static, por exemplo). Validar
      # aqui evita descobrir isso só na hora de publicar.
      #
      # Vem antes do build normal de propósito: `output: export` não deixa um
      # .next que o `next start` consiga servir, então o último build tem que ser
      # o de servidor.
      - name: Build do GitHub Pages (validação do export)
        run: npm run build
        env:
          GITHUB_PAGES: 'true'

      # Compilar não prova que o site funciona no ar. No Pages ele mora em
      # /DON-ENRICO-/, e caminho escrito à mão para arquivo de public/ não ganha
      # esse prefixo: sai do build apontando para a raiz do domínio e responde
      # 404, com todo o resto passando. Esta conferência lê o out/ e cobra que
      # cada arquivo referenciado tenha o prefixo e exista.
      - name: Conferir o site exportado
        run: npm run check:export

      - name: Build de produção
        run: npm run build
        env:
          # O envio do pedido para a planilha é decidido em tempo de build: sem
          # estas variáveis o código nem chega a existir no pacote, e a suíte não
          # teria o que conferir. A URL é falsa e o navegador substitui o envio
          # durante o teste — nada sai daqui.
          NEXT_PUBLIC_REGISTRO_URL: https://exemplo.invalido/registro
          NEXT_PUBLIC_REGISTRO_TOKEN: token-de-teste

      - name: Subir o servidor
        run: |
          npm run start &
          echo "SERVER_PID=$!" >> "$GITHUB_ENV"
          for i in $(seq 1 30); do
            if curl -sf -o /dev/null http://localhost:3000; then
              echo "servidor no ar"
              exit 0
            fi
            sleep 1
          done
          echo "o servidor não respondeu em 30s" >&2
          exit 1

      - name: Suíte de verificação
        run: npm run check -- --url http://localhost:3000 --shots

      - name: Auditoria de design
        # Roda mesmo se a suíte acima falhar, para o PR mostrar os dois relatórios
        # de uma vez em vez de um problema por rodada.
        if: always()
        run: node scripts/design-audit.mjs --url http://localhost:3000 --out audit-output

      - name: Encerrar o servidor
        if: always()
        run: kill "$SERVER_PID" 2>/dev/null || true

      - name: Publicar relatórios e capturas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: design-audit
          path: |
            audit-output/
            .checks/
          if-no-files-found: ignore
